[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eduroam-log-parser"
version = "0.1.0"
description = "Parse and pseudonymise FreeRADIUS / eduroam 802.1X authentication log files"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Gökhan Eryol", email = "gokhaneryol@gmail.com" }
]
keywords = [
    "eduroam", "freeradius", "radius", "802.1x",
    "log-parser", "anonymization", "f-ticks", "aaa", "network"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
    "Topic :: System :: Logging",
    "Topic :: Security",
]
requires-python = ">=3.10"
dependencies = []   # stdlib only

[project.urls]
Homepage       = "https://github.com/gokhaneryol/eduroam-log-parser"
Documentation  = "https://github.com/gokhaneryol/eduroam-log-parser#readme"
"Bug Tracker"  = "https://github.com/gokhaneryol/eduroam-log-parser/issues"
Dataset        = "https://huggingface.co/datasets/gokhaneryol/freeradius-8021x-log-dataset"

[project.scripts]
eduroam-log-parser = "eduroam_log_parser.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["eduroam_log_parser*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
